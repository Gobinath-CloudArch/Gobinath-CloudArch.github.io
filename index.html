<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gobinath Ramakrishnan | Enterprise Cloud Architect</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050810;
            font-family: 'Fira Code', monospace;
            color: #00ffcc;
        }

        /* --- High-Speed Racing Grid Animation --- */
        .grid-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            perspective: 600px;
            overflow: hidden;
            z-index: -2;
            background: radial-gradient(circle at center, #0a1128 0%, #050810 100%);
        }

        .moving-grid {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 150%;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 204, 0.15) 2px, transparent 2px),
                linear-gradient(to top, rgba(0, 255, 204, 0.15) 2px, transparent 2px);
            background-size: 60px 60px;
            transform: rotateX(75deg);
            animation: raceGrid 0.8s linear infinite;
            box-shadow: inset 0 0 100px 100px #050810;
        }

        @keyframes raceGrid {
            0% { transform: rotateX(75deg) translateY(0); }
            100% { transform: rotateX(75deg) translateY(60px); }
        }

        /* Horizon Glow */
        .horizon {
            position: absolute;
            top: 40%;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, rgba(0, 120, 212, 0.5), transparent);
            filter: blur(20px);
            z-index: -1;
        }

        /* --- Terminal / Typing Styles --- */
        .terminal-box {
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.1);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background-color: #00ffcc;
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- Neon Button Styles --- */
        .neon-button {
            position: relative;
            display: inline-block;
            padding: 15px 30px;
            color: #050810;
            background: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            text-decoration: none;
            overflow: hidden;
            transition: 0.2s;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ffcc, 0 0 40px #00ffcc, 0 0 80px #00ffcc;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .neon-button.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .neon-button:hover {
            background: #fff;
            color: #050810;
            box-shadow: 0 0 10px #fff, 0 0 40px #fff, 0 0 80px #fff;
        }

        .keyword { color: #38bdf8; font-weight: bold; }
        .success { color: #27C93F; font-weight: bold; }
        .warning { color: #FFBD2E; font-weight: bold; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative">

    <!-- Racing Grid Background -->
    <div class="grid-container">
        <div class="moving-grid"></div>
    </div>
    <div class="horizon"></div>

    <!-- Central Terminal Window -->
    <div class="terminal-box w-11/12 max-w-4xl rounded-xl overflow-hidden z-10 flex flex-col h-[75vh] md:h-[65vh]">
        <!-- Terminal Header -->
        <div class="bg-slate-900/80 px-4 py-3 flex items-center justify-between border-b border-cyan-500/30">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-[#FF5F56]"></div>
                <div class="w-3 h-3 rounded-full bg-[#FFBD2E]"></div>
                <div class="w-3 h-3 rounded-full bg-[#27C93F]"></div>
            </div>
            <div class="text-[11px] text-cyan-500/70 tracking-widest uppercase">Gobi-Main-Node_v2.0</div>
            <i class="fa-solid fa-microchip text-cyan-500/70"></i>
        </div>

        <!-- Typing Content Area -->
        <div class="p-6 md:p-10 flex-1 overflow-y-auto text-sm md:text-base leading-relaxed text-cyan-300">
            <div id="typewriter-content" class="whitespace-pre-wrap"></div><span class="cursor" id="cursor"></span>
        </div>

        <!-- Action Area (Fades in at the end) -->
        <div class="p-6 border-t border-cyan-500/20 bg-slate-900/50 flex justify-center items-center h-32">
            <a href="https://gobinath-cloudarch.github.io/portfolio" id="action-btn" class="neon-button">
                <i class="fa-solid fa-rocket mr-2"></i> For Portfolio Click Here
            </a>
        </div>
    </div>

    <script>
        // The text to be typed out line by line
        const linesToType = [
            "> INITIALIZING SECURE CONNECTION... <span class='success'>[OK]</span>",
            "> AUTHENTICATING USER: GOBINATH RAMAKRISHNAN...",
            "> ACCESS GRANTED. WELCOME TO THE MASTER NODE.\n",
            "<span class='keyword'>[SYSTEM BIO]</span> 12+ Years Enterprise Cloud & Platform Engineer.",
            "<span class='keyword'>[CREDENTIALS]</span> AZ-305 Architect Expert, AZ-104 Admin, AWS Cloud Quest.\n",
            "<span class='warning'>LOADING FEATURED ENGINEERING PROJECT: PHOENIX SUITE...</span>",
            "> Booting Multi-Threaded Execution Engine...",
            "> Establishing resilient WinRM Server connections...",
            "> Initiating continuous hardware telemetry via Glass UI...",
            "> Automating remote server patching protocols...",
            "> Bypassing restrictions: Executing precision XML overrides (Excluding PhoenixIA)...",
            "> Synchronizing Police & IA Enterprise SQL Databases...",
            "> Deployment pipelines fully automated. Zero-touch achieved.\n",
            "<span class='success'>SYSTEM STATUS: 100% OPERATIONAL & HIGHLY AVAILABLE.</span>",
            "> Ready to launch full interactive portfolio..."
        ];

        const container = document.getElementById("typewriter-content");
        const actionBtn = document.getElementById("action-btn");
        
        let currentLine = 0;
        let currentChar = 0;
        let typingSpeed = 30; // Milliseconds per character
        let lineDelay = 500;  // Milliseconds pause between lines

        // Strip HTML tags for character counting but inject them properly
        function typeWriter() {
            if (currentLine < linesToType.length) {
                let lineHtml = linesToType[currentLine];
                
                // We inject the whole line at once using a simulated delay to keep HTML tags intact
                // For a true char-by-char with HTML, it requires complex parsing. 
                // A great visual hack is to type text normally, but drop HTML lines in instantly with a delay.
                
                // Let's implement a char-by-char that handles HTML blocks instantly
                let isTag = false;
                let currentText = "";
                let i = 0;

                function typeChar() {
                    if (i < lineHtml.length) {
                        let char = lineHtml.charAt(i);
                        
                        if (char === '<') isTag = true;
                        
                        currentText += char;
                        container.innerHTML = currentText;
                        i++;

                        if (isTag) {
                            if (char === '>') isTag = false;
                            typeChar(); // Skip delay for HTML tags
                        } else {
                            // Scroll to bottom as it types
                            container.parentElement.scrollTop = container.parentElement.scrollHeight;
                            setTimeout(typeChar, typingSpeed);
                        }
                    } else {
                        // Line finished, add a newline and move to next line
                        container.innerHTML += '\n';
                        currentLine++;
                        setTimeout(typeWriter, lineDelay);
                    }
                }
                
                typeChar();
                
            } else {
                // Typing finished, show the button
                actionBtn.classList.add("visible");
            }
        }

        // Start typing after a short initial boot delay
        setTimeout(typeWriter, 1000);
    </script>
</body>
</html>
